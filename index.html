  <!-- Apply the saved theme (and a still sky) before first paint (src/theme.js and the shell take over from there). -->
  <script>
    try {
      const prefs = JSON.parse(localStorage.getItem('scentcast.prefs'));
      const t = new URLSearchParams(location.search).get('theme') ?? prefs?.theme;
      if (t) document.documentElement.dataset.theme = t;
      if (prefs?.stillSky) document.documentElement.classList.add('still-sky');
    } catch {}
  </script>
  <script type="module" src="src/main.js"></script>
