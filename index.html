<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Scentcast · what to wear today</title>
  <meta name="description" content="What to wear today from your own fragrance collection, based on the weather and the occasion.">
  <meta name="theme-color" content="#0b0c11">
  <meta name="color-scheme" content="dark">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Scentcast">
  <meta property="og:title" content="Scentcast · what to wear today">
  <meta property="og:description" content="Weather-aware fragrance picks from your own collection. Today, the week ahead, or any occasion.">
  <meta property="og:url" content="https://davidbeck45.github.io/scentcast/">
  <meta property="og:image" content="https://davidbeck45.github.io/scentcast/icons/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Scentcast: a night landscape under a crescent moon with the Scentcast wordmark">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Scentcast">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/fraunces-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="src/tokens.css">
  <link rel="stylesheet" href="src/styles.css">
  <!-- Apply the saved theme before first paint (src/theme.js takes over from there). -->
  <script>
    try {
      const t = new URLSearchParams(location.search).get('theme') ?? JSON.parse(localStorage.getItem('scentcast.prefs'))?.theme;
      if (t) document.documentElement.dataset.theme = t;
    } catch {}
  </script>
  <script type="module" src="src/main.js"></script>
  <!-- Every module main.js imports, fetched in parallel rather than as a waterfall (test/shell.test.js keeps the list whole). -->
  <link rel="modulepreload" href="src/accords.js">
  <link rel="modulepreload" href="src/wmo.js">
  <link rel="modulepreload" href="src/profiles.js">
  <link rel="modulepreload" href="src/custom.js">
  <link rel="modulepreload" href="src/engine.js">
  <link rel="modulepreload" href="src/occasions.js">
  <link rel="modulepreload" href="src/weather.js">
  <link rel="modulepreload" href="src/location.js">
  <link rel="modulepreload" href="src/history.js">
  <link rel="modulepreload" href="src/hidden.js">
  <link rel="modulepreload" href="src/collections.js">
  <link rel="modulepreload" href="src/api.js">
  <link rel="modulepreload" href="src/fragella.js">
  <link rel="modulepreload" href="src/fragrantica.js">
  <link rel="modulepreload" href="src/layering.js">
  <link rel="modulepreload" href="src/scene.js">
  <link rel="modulepreload" href="src/theme.js">
  <link rel="modulepreload" href="src/ui.js">
</head>
<body>
  <div id="app">
    <h1 id="page-title" class="visually-hidden">Scentcast</h1>
    <header id="hero" class="hero"></header>
    <nav class="tabs" role="tablist" aria-label="View">
      <button role="tab" id="tab-today" data-view="today" aria-selected="true" aria-controls="view">Today</button>
      <button role="tab" id="tab-week" data-view="week" aria-selected="false" aria-controls="view" tabindex="-1">Week</button>
      <button role="tab" id="tab-occasion" data-view="occasion" aria-selected="false" aria-controls="view" tabindex="-1">Occasion</button>
    </nav>
    <main id="view" role="tabpanel" aria-labelledby="tab-today" tabindex="-1"></main>
    <footer id="foot"></footer>
  </div>
  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
