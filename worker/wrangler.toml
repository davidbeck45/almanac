name = "scentcast-api"
main = "index.js"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

# The Fragella key is a secret: `npx wrangler secret put FRAGELLA_KEY`
[vars]
ALLOWED_ORIGINS = "https://davidbeck45.github.io,http://127.0.0.1:5173,http://localhost:5173"
# Fragella's free plan is 20 requests a month (see index.js).
DAILY_LOOKUPS_PER_IP = "3"
DAILY_LOOKUPS = "4"

[[kv_namespaces]]
binding = "CACHE"
id = "dbf97da4070e4677a38bf5bc5a15d77a"
